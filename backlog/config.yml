project_name: "maven-dependency-history"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vi"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
definition_of_done: ["Invoke /simplify on the final changes and address its recommendations; record invocation evidence in the task.", "Invoke /code-review with high effort on the final changes and resolve or explicitly track every finding; record invocation evidence in the task.", "Run applicable verification and record commands and results. Document any inapplicable checks explicitly."]
